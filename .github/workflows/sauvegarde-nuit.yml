name: Sauvegarde de nuit (base Luxyra -> Google Drive, chiffrée)

# Chaque nuit : copie complète de la base (salons, clientes, tickets, clôtures, journal NF525, comptes),
# CHIFFRÉE (AES-256, mot de passe que seul Alexandre connaît), déposée dans son Google Drive
# (dossier « Sauvegardes Luxyra », 60 jours conservés) via un petit script Google (docs/sauvegarde-drive.gs).
# Rien n'est stocké sur GitHub. En cas d'échec, GitHub envoie un email d'alerte.
#
# Secrets GitHub (Settings > Secrets and variables > Actions) :
#   SUPABASE_DB_URL    : Supabase > Connect > « Session pooler » (URI postgresql://...pooler.supabase.com:5432/postgres)
#   BACKUP_PASSPHRASE  : mot de passe de chiffrement (à garder précieusement : sans lui, pas de restauration)
#   GDRIVE_WEBAPP_URL  : URL de l'application Web du script Google (se termine par /exec)
#   GDRIVE_SECRET      : même valeur que la propriété LUXYRA_SECRET du script Google
# Tant que ces secrets n'existent pas, le travail s'arrête proprement.
#
# RESTAURER : gpg --decrypt luxyra-AAAA-MM-JJ.dump.gpg > luxyra.dump  (demande BACKUP_PASSPHRASE)
#             pg_restore --no-owner --no-privileges -d "URL_DE_LA_BASE" luxyra.dump

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 01:30/02:30 à Paris, après les clôtures automatiques
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      GDRIVE_WEBAPP_URL: ${{ secrets.GDRIVE_WEBAPP_URL }}
      GDRIVE_SECRET: ${{ secrets.GDRIVE_SECRET }}
    steps:
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ] || [ -z "$GDRIVE_WEBAPP_URL" ] || [ -z "$GDRIVE_SECRET" ]; then
            echo "Secrets de sauvegarde non configurés : rien à faire."
            echo "pret=non" >> "$GITHUB_OUTPUT"
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Copie de la base (pg_dump 17)
        if: steps.cfg.outputs.pret == 'oui'
        run: |
          set -euo pipefail
          JOUR=$(TZ=Europe/Paris date +%F)
          echo "JOUR=$JOUR" >> "$GITHUB_ENV"
          docker run --rm -e PGURL="$SUPABASE_DB_URL" -v "$PWD:/out" postgres:17 \
            sh -c 'pg_dump "$PGURL" --format=custom --compress=9 --no-owner --no-privileges \
              --schema=public --schema=auth --schema=lx_prive --schema=storage --schema=supabase_migrations \
              --file=/out/luxyra.dump'
          ls -l luxyra.dump

      - name: Chiffrement (AES-256)
        if: steps.cfg.outputs.pret == 'oui'
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 --output "luxyra-$JOUR.dump.gpg" luxyra.dump
          shred -u luxyra.dump || rm -f luxyra.dump
          ls -l "luxyra-$JOUR.dump.gpg"

      - name: Dépôt dans Google Drive
        if: steps.cfg.outputs.pret == 'oui'
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, urllib.request
          jour = os.environ["JOUR"]
          nom = f"luxyra-{jour}.dump.gpg"
          data = open(nom, "rb").read()
          if len(data) > 35 * 1024 * 1024:
              raise SystemExit(f"Sauvegarde trop volumineuse pour le script Google ({len(data)} octets)")
          corps = json.dumps({"secret": os.environ["GDRIVE_SECRET"], "nom": nom,
                              "sha256": hashlib.sha256(data).hexdigest(),
                              "data": base64.b64encode(data).decode()}).encode()
          req = urllib.request.Request(os.environ["GDRIVE_WEBAPP_URL"], data=corps,
                                       headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=300) as r:
              rep = r.read().decode("utf-8", "replace")
          try:
              j = json.loads(rep)
          except Exception:
              raise SystemExit("Réponse inattendue du script Google : " + rep[:300])
          if not j.get("ok"):
              raise SystemExit("Dépôt refusé par le script Google : " + json.dumps(j))
          print("Déposé dans Google Drive :", j)
          PY
          rm -f luxyra-*.dump.gpg
