<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Administration Luxyra</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#06080f;color:#fff;font-family:Arial,Helvetica,sans-serif;padding:20px;box-sizing:border-box}
.c{max-width:420px;width:100%;background:#12141e;border:1px solid rgba(212,168,67,.35);border-radius:18px;padding:26px 22px;text-align:center}
h1{font-family:Georgia,serif;font-weight:600;font-size:22px;margin:10px 0 8px}
p{color:#94a3b8;font-size:14px;line-height:1.6;margin:0 0 18px}
a.b{display:block;padding:14px;border-radius:12px;font-weight:800;text-decoration:none;margin-top:10px;font-size:15px}
a.or{background:linear-gradient(135deg,#d4a843,#b8960f);color:#0a0a0a}
a.ghost{border:1.5px solid rgba(212,168,67,.5);color:#d4a843}
</style></head><body>
<div class="c">
  <img src="/email/luxyra-logo-128.png" width="60" height="60" alt="Luxyra" style="border-radius:12px">
  <h1>L’administration s’ouvre dans Chrome</h1>
  <p>Vous êtes dans l’application <b id="app">Luxyra Pro</b>. L’espace d’administration Luxyra ne s’affiche pas dans l’application : il s’ouvre dans le navigateur Chrome.</p>
  <a class="b or" id="chrome" href="#">Ouvrir l’administration dans Chrome</a>
  <a class="b ghost" id="retour" href="/app.html?source=play">Retour à l’application</a>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search), pkg=q.get("pkg")||"fr.luxyra.pro", dest=q.get("dest")||"/admin";
  if(!/^\/admin(\.html)?([?#/].*)?$/.test(dest)) dest="/admin";
  var client=pkg==="fr.luxyra.client", retour=client?"/client.html?source=app":"/app.html?source=play";
  document.getElementById("app").textContent=client?"Luxyra":"Luxyra Pro";
  document.getElementById("retour").href=retour;
  var url="https://admin.luxyra.fr"+dest.replace(/^\/admin(\.html)?\/?/,"/"); // 31/10 : admin sur son sous-domaine
  var intent="intent://admin.luxyra.fr"+dest.replace(/^\/admin(\.html)?\/?/,"/").replace(/#.*$/,"")+"#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+encodeURIComponent(url)+";end";
  var b=document.getElementById("chrome"); b.href=intent;
  b.addEventListener("click",function(){ setTimeout(function(){ location.replace(retour); },1500); });
})();
</script>
</body></html>
