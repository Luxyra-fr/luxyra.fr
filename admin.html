    h+='<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--border);font-size:13px"><span><b>'+saEsc(x.salon)+'</b> — '+saE(x.montant)+' — '+(x.tentatives||0)+' tentative(s)'+(x.prochaine?' · prochaine le '+saD(x.prochaine):'')+'</span><span style="display:flex;gap:6px">';
    if(x.url) h+='<a class="dp-btn" style="font-size:11px" href="'+saEsc(x.url)+'" target="_blank">Voir</a>';
    if(x.salon_id) h+='<button class="dp-btn" style="font-size:11px" onclick="saRelancer(\''+x.salon_id+'\',\''+x.id+'\',true)">Relancer le prélèvement</button>';
    h+='</span></div>';
  });
  h+='</div>';
  // Virements
  h+='<div class="card" style="margin-bottom:14px"><div style="font-weight:800;margin-bottom:8px">🏦 Virements vers ton compte bancaire</div>';
  if(!(d.virements||[]).length) h+='<div style="font-size:12px;color:var(--text2)">Aucun virement</div>';
  (d.virements||[]).forEach(function(x){ h+='<div style="display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--border);font-size:13px"><span>'+saD(x.arrivee)+'</span><span>'+saE(x.montant)+' · '+saEsc(x.statut==="paid"?"versé":x.statut==="in_transit"?"en cours":x.statut)+'</span></div>'; });
  h+='</div>';
  // Comptes Stripe des salons
  h+='<div class="card"><div style="font-weight:800;margin-bottom:8px">💳 Comptes Stripe des salons (paiements en ligne)</div>';
  if(!(d.salons_connect||[]).length) h+='<div style="font-size:12px;color:var(--text2)">Aucun salon</div>';
  (d.salons_connect||[]).forEach(function(x){ h+='<div style="display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--border);font-size:13px;cursor:pointer" onclick="if(typeof openD===\'function\')openD(\''+x.id+'\')"><span>'+saEsc(x.nom)+'</span><span>'+saEsc(x.statut||"?")+'</span></div>'; });
  h+='</div>';
  el.innerHTML=h;
}

// --- Bloc « Gestion Stripe » dans la fiche d'un salon ---
function saBlocSalon(s){
  if(!s.stripeSub&&!s.stripeCust&&!s.connectId) return '';
  return '<div class="dp-section"><div class="dp-label">⚙️ Gestion Stripe</div><div id="saSalon-'+s.id+'"><button class="dp-btn" style="width:100%" onclick="saChargerSalon(\''+s.id+'\')">Charger abonnement, factures et paiements</button></div></div>';
}
async function saChargerSalon(id){
  var el=document.getElementById("saSalon-"+id); if(!el) return;
  el.innerHTML='<div style="font-size:12px;color:var(--text2)">Chargement…</div>';
  var d=await saApi({op:"salon",salon_id:id});
  if(d.error){ el.innerHTML='<div style="color:var(--red)">❌ '+saEsc(d.error)+'</div>'; return; }
  var h='';
  var ab=d.abonnement;
  if(ab){
    h+='<div class="dp-field"><span class="k">Abonnement</span><span class="v"><b>'+(SA_FORFAIT[ab.forfait]||ab.forfait)+'</b> · '+saE(ab.mensuel)+'/mois · '+saEsc(ab.statut)+'</span></div>';
    h+='<div class="dp-field"><span class="k">Prochaine échéance</span><span class="v">'+saD(ab.fin_periode)+(ab.annule_fin_periode?' <b style="color:var(--red)">(résiliation programmée)</b>':'')+'</span></div>';
    if(ab.essai_jusqu) h+='<div class="dp-field"><span class="k">Offert jusqu\'au</span><span class="v">'+saD(ab.essai_jusqu)+'</span></div>';
    (ab.remises||[]).forEach(function(r){ h+='<div class="dp-field"><span class="k">Remise</span><span class="v">'+saEsc(r.nom)+(r.fin?' (jusqu\'au '+saD(r.fin)+')':'')+'</span></div>'; });
    h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">';
    h+='<button class="dp-btn" style="font-size:11px" onclick="saRemise(\''+id+'\')">🏷 Appliquer une remise</button>';
    if((ab.remises||[]).length) h+='<button class="dp-btn" style="font-size:11px" onclick="saAction(\''+id+'\',{op:\'retirer_coupon\'},\'Retirer la remise de ce salon ?\')">Retirer la remise</button>';
    h+='<button class="dp-btn" style="font-size:11px" onclick="saForfait(\''+id+'\',\''+ab.forfait+'\')">🔁 Changer de forfait</button>';
    if(ab.annule_fin_periode) h+='<button class="dp-btn success" style="font-size:11px" onclick="saAction(\''+id+'\',{op:\'reprendre\'},\'Annuler la résiliation programmée ? L\\\'abonnement continuera normalement.\')">↩ Annuler la résiliation</button>';
    else h+='<button class="dp-btn" style="font-size:11px;color:var(--red)" onclick="saAction(\''+id+'\',{op:\'annuler_fin_periode\'},\'Résilier cet abonnement à la fin de la période payée ('+saD(ab.fin_periode)+') ?\',true)">Résilier en fin de période</button>';
    h+='</div>';
  }
  if((d.factures||[]).length){
    h+='<div style="font-weight:700;font-size:12px;margin:10px 0 4px">Factures Luxyra</div>';
    d.factures.forEach(function(f){
      var st={paid:"payée",open:"<b style='color:var(--red)'>impayée</b>",void:"annulée",draft:"brouillon",uncollectible:"irrécouvrable"}[f.statut]||f.statut;
      h+='<div style="display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:12px;padding:4px 0;border-top:1px solid var(--border)"><span>'+saD(f.date)+' · '+saEsc(f.numero||"")+' · '+saE(f.statut==="paid"?f.paye:f.du)+' · '+st+'</span><span style="display:flex;gap:4px">';
      if(f.pdf) h+='<a class="dp-btn" style="font-size:10px;padding:3px 7px" href="'+saEsc(f.pdf)+'" target="_blank">PDF</a>';
      if(f.statut==="open") h+='<button class="dp-btn" style="font-size:10px;padding:3px 7px" onclick="saRelancer(\''+id+'\',\''+f.id+'\')">Relancer</button>';
      if(f.statut==="paid"&&f.payment_intent) h+='<button class="dp-btn" style="font-size:10px;padding:3px 7px" onclick="saRembourser(\''+id+'\',\''+f.payment_intent+'\','+f.paye+',\'abonnement Luxyra\')">Rembourser</button>';
      h+='</span></div>';
    });
  }
  var c=d.connect;
  if(c){
    h+='<div style="font-weight:700;font-size:12px;margin:12px 0 4px">Compte Stripe du salon</div>';
    h+='<div style="font-size:12px">Encaissements : '+(c.encaissements?'✅':'❌')+' · Virements : '+(c.virements?'✅':'❌')+' · Dossier envoyé : '+(c.dossier_envoye?'✅':'❌')+'</div>';
    if(c.blocage) h+='<div style="font-size:12px;color:var(--red)">Blocage : '+saEsc(c.blocage)+'</div>';
    if((c.en_retard||[]).length) h+='<div style="font-size:12px;color:var(--red)">En retard : '+saEsc(c.en_retard.join(", "))+'</div>';
    if((c.a_fournir||[]).length) h+='<div style="font-size:12px;color:var(--orange)">À fournir : '+saEsc(c.a_fournir.join(", "))+'</div>';
    if(!c.encaissements||!c.virements||(c.a_fournir||[]).length) h+='<button class="dp-btn" style="font-size:11px;margin-top:6px" onclick="saLienInscription(\''+id+'\')">🔗 Lien pour terminer son inscription Stripe</button>';
    var P=d.paiements_clientes||[];
    h+='<div style="font-weight:700;font-size:12px;margin:12px 0 4px">Paiements des clients (90 jours) : '+P.length+'</div>';
    P.forEach(function(p){
      var stl={succeeded:"payé",requires_capture:"empreinte en attente",canceled:"annulé",processing:"en cours"}[p.statut]||p.statut;
      h+='<div style="display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:12px;padding:4px 0;border-top:1px solid var(--border)"><span>'+saD(p.date)+' · '+saE(p.montant)+' · '+saEsc(p.type||"")+' · '+stl+(p.rembourse?' · <b>remboursé '+saE(p.rembourse)+'</b>':'')+'<br><span style="color:var(--text2)">'+saEsc(p.description).slice(0,90)+'</span></span>';
      if(p.statut==="succeeded"&&p.rembourse<p.montant) h+='<button class="dp-btn" style="font-size:10px;padding:3px 7px" onclick="saRembourser(\''+id+'\',\''+p.id+'\','+(p.montant-p.rembourse)+',\'paiement d\\\'un client (repris sur le compte du salon)\')">Rembourser</button>';
      h+='</div>';
    });
  }
  if(!h) h='<div style="font-size:12px;color:var(--text2)">Aucune donnée Stripe pour ce salon.</div>';
  h+='<button class="dp-btn" style="width:100%;margin-top:10px;font-size:11px" onclick="saChargerSalon(\''+id+'\')">↻ Actualiser</button>';
  el.innerHTML=h;
}
async function saAction(id,body,question,danger){
  if(question && !confirm((danger?"⚠️ ":"")+question)) return;
  body.salon_id=id;
  var m=prompt("Motif (gardé dans le journal admin) :",""); if(m===null) return; body.motif=m;
  var d=await saApi(body);
  if(d.error) alert("❌ "+d.error); else alert("✅ Fait");
  saChargerSalon(id);
}
function saRemise(id){
  var t=prompt("Remise : tape un pourcentage (ex. 50%) ou un montant en euros (ex. 5€)","50%"); if(t===null) return;
  var pct=/%/.test(t)?parseFloat(t):0, mt=/€|eur/i.test(t)||!/%/.test(t)?parseFloat(String(t).replace(",",".")):0; if(pct) mt=0;
  var dur=prompt("Durée : 1 = une seule facture, 2 = plusieurs mois, 3 = pour toujours","1"); if(dur===null) return;
  var body={op:"coupon",pourcentage:pct||0,montant:mt||0,duree:dur==="3"?"forever":dur==="2"?"repeating":"once"};
  if(dur==="2"){ var n=prompt("Combien de mois ?","3"); if(n===null) return; body.mois=parseInt(n)||1; }
  saAction(id,body,"Appliquer "+(pct?pct+" %":saE(mt))+" de remise ("+(body.duree==="once"?"1 facture":body.duree==="forever"?"pour toujours":body.mois+" mois")+") ?");
}
function saForfait(id,actuel){
  var cible=(actuel==="essentiel")?"pro":"essential";
  saAction(id,{op:"changer_forfait",plan:cible},"Passer ce salon au forfait "+(cible==="pro"?"Pro (tarif Fondateur s'il reste des places)":"Essentiel (le site et la réservation en ligne seront coupés)")+" ? La différence est calculée au prorata par Stripe.",true);
}
async function saRelancer(id,fid,depuisOverview){
  if(!confirm("Relancer maintenant le prélèvement de cette facture ?")) return;
  var d=await saApi({op:"relancer_facture",salon_id:id,facture_id:fid});
  alert(d.error?"❌ "+d.error:"✅ Facture payée");
  if(depuisOverview) saChargerOverview(); else saChargerSalon(id);
}
async function saRembourser(id,pi,max,nature){
  var m=prompt("Rembourser un "+nature+".\nMontant à rembourser (max "+saE(max)+") :",String(max).replace(".",",")); if(m===null) return;
  var mt=parseFloat(String(m).replace(",",".")); if(!(mt>0)||mt>max+0.001){ alert("Montant invalide"); return; }
  var motif=prompt("Motif du remboursement (obligatoire) :",""); if(!motif) return;
  if(!confirm("⚠️ Confirmer le remboursement de "+saE(mt)+" ? Action irréversible.")) return;
  var d=await saApi({op:"rembourser",salon_id:id,payment_intent:pi,montant:mt,motif:motif});
  alert(d.error?"❌ "+d.error:"✅ "+saE(d.montant)+" remboursés");
  saChargerSalon(id);
}
async function saLienInscription(id){
  var d=await saApi({op:"lien_inscription",salon_id:id});
  if(d.error){ alert("❌ "+d.error); return; }
  try{ await navigator.clipboard.writeText(d.url); }catch(e){}
  prompt("Lien copié (valable quelques minutes) — à envoyer au salon :",d.url);
}

async function lxOfferMonths(salonId){
  var n=prompt("Offrir combien de mois a ce salon ? (1 a 12)\n\nCela REPOUSSE sa prochaine echeance Stripe d'autant (aucune facture pendant ces mois). A utiliser uniquement sur un salon reellement abonne payant.","1");
  if(n===null) return;
  n=parseInt(n,10); if(!n||n<1||n>12){ alert("Nombre invalide (1 a 12)."); return; }
  if(!confirm("Confirmer : offrir "+n+" mois ? La prochaine facture Stripe du salon sera repoussee de "+n+" mois.")) return;
  try{
    var sess=await _sb.auth.getSession();
    var jwt=(sess&&sess.data&&sess.data.session)?sess.data.session.access_token:null;
    if(!jwt){ alert("Session expiree, reconnecte-toi."); return; }
    var r=await fetch("/api/admin/offer-month",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({salon_id:salonId,months:n,jwt:jwt})});
    var j=await r.json().catch(function(){return{};});
    if(r.ok && j.success){ alert("✅ "+n+" mois offerts. Prochaine echeance : "+(j.next_billing||"?")); if(typeof loadData==="function") loadData(); }
    else { alert("❌ "+(j.error||("Erreur "+r.status))); }
  }catch(e){ alert("❌ "+(e&&e.message)); }
}
async function saveFreePlan(id){
  var isFree=document.getElementById("dpFree").checked;
  var plan=document.getElementById("dpFreePlan").value;
  var dur=document.getElementById("dpFreeDur").value;
  var freeUntil=null;
  if(isFree&&dur!=="unlimited"){
    var d=new Date();
    if(dur==="1m")d.setMonth(d.getMonth()+1);
    else if(dur==="3m")d.setMonth(d.getMonth()+3);
    else if(dur==="6m")d.setMonth(d.getMonth()+6);
    else if(dur==="1y")d.setFullYear(d.getFullYear()+1);
    freeUntil=d.toISOString().slice(0,10);
  }
  var update={is_free:isFree,free_until:freeUntil};
  if(isFree){update.plan=plan;update.status="active";update.trial_end=null;}
  // 2026-10-09 : salon abonné chez Stripe -> pas de facture pendant l'offre (pause de facturation), reprise à la fin
  var _s0=gSalon(id);
  if(_s0&&_s0.stripeSub){
    var dz=await saApi({op:isFree?"pause_facturation":"reprendre_facturation",salon_id:id,jusqu_au:freeUntil||"",motif:"plan offert (admin)"});
    if(dz.error){ alert("❌ Stripe : "+dz.error+"\nRien n'a été modifié."); return; }
  }
  var _avF=_s0?{is_free:_s0.isFree,free_until:_s0.freeUntil||null,plan:_s0.plan,status:_s0.status}:null;
  var _rf=await _sb.from("salons").update(update).eq("id",id).select("id");
  if(_rf.error||!_rf.data||!_rf.data.length){ alert("❌ Plan offert non enregistré : "+((_rf.error&&_rf.error.message)||"aucune ligne (droits ? double authentification ?)")); return; }
  await saJournal(id,isFree?"PLAN_OFFERT":"PLAN_OFFERT_RETIRE",isFree?(plan+(freeUntil?" jusqu'au "+freeUntil:" illimité")):"",_avF,update);
  var s=gSalon(id);
  if(s){s.isFree=isFree;s.freeUntil=freeUntil;s.plan=isFree?plan:s.plan;s.status=isFree?"active":s.status;}
  alert("\u2705 "+(isFree?"Plan "+plan+" offert"+(freeUntil?" jusqu\u2019au "+fmtD(freeUntil):" (illimit\u00e9)"):"Plan gratuit d\u00e9sactiv\u00e9"));
  openD(id);
}

async function addSmsCredits(id,nb){
  var m=prompt("Motif (gardé dans l'historique) :","Geste commercial"); if(m===null) return;
  var v=await smsMouvement(id,nb,m); if(v!==null){ var s=gSalon(id); if(s) s.smsCredits=v; alert("✅ +"+nb+" SMS — solde "+v); openD(id); }
}

async function addSmsCreditsCustom(id){
  var nb=prompt("Nombre de SMS \u00e0 ajouter :");
  if(!nb||isNaN(nb)||+nb<=0)return;
  await addSmsCredits(id,+nb);
}

async function resetSmsCredits(id){
  var s=gSalon(id); var cur=s?(s.smsCredits||0):0; if(!cur){ alert("Solde déjà à 0"); return; }
  if(!confirm("Remettre le solde SMS à 0 ("+cur+" SMS retirés) ?"))return;
  var m=prompt("Motif (gardé dans l'historique) :",""); if(m===null) return;
  var v=await smsMouvement(id,-cur,m||"Remise à zéro"); if(v===null) return;
  if(s){s.smsCredits=v;}
  alert("\u2705 Solde SMS remis \u00e0 0");
  openD(id);
}

checkSession();

setInterval(async function(){if(_online&&_sb){await loadDemandes();var b=document.getElementById("badgeDemandes");if(b){var n=DEMANDES.filter(function(d){return d.status==="new";}).length;b.textContent=n>0?n:"";}}},30000);
</script>
