<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Votre proposition de RDV — Luxyra</title>
<link rel="stylesheet" href="https://luxyra.fr/fonts/luxyra-fonts.css">
<script src="https://js.stripe.com/v3/"></script>
<style>
:root{
  --gold:#c8a84e;--gold-l:#d4a843;--bg:#0a0a0a;--bg2:#101014;--bg3:#16161c;
  --text:#fff;--text2:rgba(255,255,255,.7);--text3:rgba(255,255,255,.4);
  --green:#4ade80;--red:#f87171;--blue:#60a5fa;
  --f1:'Playfair Display',serif;--f2:'Nunito',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--f2);min-height:100vh}
.wrap{max-width:540px;margin:0 auto;padding:24px 16px}
.hdr{text-align:center;padding:24px 0 12px}
.hdr .logo{max-width:180px;max-height:80px;margin-bottom:8px;border-radius:12px}
.hdr .salon{font-family:var(--f1);font-size:24px;color:var(--gold);font-weight:800;margin:8px 0 4px}
.hdr .sub{font-size:13px;color:var(--text3)}
.card{background:var(--bg3);border:1.5px solid rgba(200,168,78,.15);border-radius:16px;padding:20px;margin-bottom:14px}
.card h2{font-family:var(--f1);font-size:18px;margin:0 0 12px;color:var(--gold);font-weight:700}
.row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px dotted rgba(200,168,78,.08)}
.row:last-child{border-bottom:none}
.row .v{font-weight:700;color:var(--gold)}
.row.tot{border-top:2px solid var(--gold);margin-top:8px;padding-top:10px;font-size:16px}
.item{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--text2)}
.item .v{color:var(--gold);font-weight:700}
.msg{background:rgba(200,168,78,.06);border-left:3px solid var(--gold);padding:12px 14px;border-radius:6px;font-size:13px;color:var(--text2);font-style:italic;line-height:1.5;margin-top:12px}
.btn{display:block;width:100%;padding:16px;border-radius:12px;font-size:15px;font-weight:800;text-align:center;cursor:pointer;border:none;font-family:var(--f2);transition:all .25s;margin-bottom:10px}
.btn-gold{background:var(--gold);color:#0a0a0a}.btn-gold:hover{background:var(--gold-l);transform:translateY(-1px)}
.btn-outline{background:transparent;border:2px solid rgba(255,255,255,.15);color:var(--text2)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-danger{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);color:var(--red)}
.btn-danger:hover{background:rgba(248,113,113,.15)}
.btn:disabled{opacity:.4;pointer-events:none}
.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);color:var(--red);padding:12px;border-radius:8px;font-size:13px;margin:10px 0;display:none}
.warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);color:#fbbf24;padding:12px;border-radius:8px;font-size:13px;margin:10px 0}
.spin{width:32px;height:32px;border:3px solid rgba(200,168,78,.2);border-top-color:var(--gold);border-radius:50%;animation:r 1s linear infinite;margin:24px auto;display:block}
@keyframes r{to{transform:rotate(360deg)}}
.expires{font-size:11px;color:var(--text3);text-align:center;margin-top:8px}
.success-page{text-align:center;padding:40px 20px}
.success-page .ico{font-size:64px;margin-bottom:14px}
.success-page h2{font-family:var(--f1);font-size:24px;color:var(--green);margin:0 0 10px}
.success-page p{font-size:14px;color:var(--text2);line-height:1.7}
.label{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-bottom:6px}
input[type=text],textarea{width:100%;padding:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;font-size:14px;font-family:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--bg3);border:2px solid var(--gold);border-radius:18px;padding:24px;max-width:420px;width:100%}
.stripe-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:14px;min-height:44px}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="spin"></div>
  <div style="text-align:center;color:var(--text3);font-size:13px">Chargement de votre proposition…</div>
</div>

<script>
var SB_URL="https://kxdgjtvrkwugbifgppai.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4ZGdqdHZya3d1Z2JpZmdwcGFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNDE2NTgsImV4cCI6MjA4ODYxNzY1OH0.J3jVuoHSWA0wXyaWxiRzILEWVNr8hbbgVYg73UEDTuI";
var STRIPE_PK="pk_live_51TCS0KPk42Psx94TFs6cev5MA67bJtH7kOd5eBU1QQV8Qs9XQDz1SAnix1K4x9DOU6Qseb3fEap7eEfYGtRE7muk00hV4h1WVj";
var stripe=null; try{stripe=Stripe(STRIPE_PK);}catch(e){console.warn("Stripe not loaded",e);}

function getToken(){
  var p=new URLSearchParams(window.location.search);
  return p.get("t")||"";
}
function escapeHtml(s){ return String(s||"").replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function fmtDate(s){
  if(!s) return "";
  var p=s.split("-");
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  var jours=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
  var mois=["janvier","fevrier","mars","avril","mai","juin","juillet","aout","septembre","octobre","novembre","decembre"];
  return jours[d.getDay()]+" "+p[2]+" "+mois[d.getMonth()]+" "+p[0];
}
function fmtExpires(s){
  if(!s) return "";
  var t=new Date(s);
  var diff=Math.max(0,(t-new Date())/1000);
  if(diff<3600) return "Expire dans "+Math.floor(diff/60)+" min";
  if(diff<86400) return "Expire dans "+Math.floor(diff/3600)+" h";
  return "Expire le "+t.toLocaleDateString("fr-FR")+" a "+t.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}

var STATE={token:null,demande:null,salon:null};

async function fetchProposal(){
  var token=getToken();
  if(!token){ renderError("Lien invalide", "Le lien que vous avez recu est incomplet."); return; }
  STATE.token=token;
  try{
    var r=await fetch(SB_URL+"/functions/v1/rdv-demande-proposal-action",{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY},
      body:JSON.stringify({token:token,action:"get"})
    });
    var data=await r.json();
    if(!r.ok){
      renderError("Lien invalide ou expire", data.error||"Cette proposition n\u0027est plus accessible.");
      return;
    }
    STATE.demande=data.demande;
    STATE.salon=data.salon||{};
    if(data.version===2){ STATE.v2=data; renderV2(); return; } // 2026-10-30 : proposition à plusieurs options
    if(data.demande.status==="confirmed"){ renderConfirmed(); return; }
    if(data.demande.status==="refused"){ renderRefused(); return; }
    if(data.demande.status==="expired"||data.demande.status==="cancelled_by_salon"){ renderError("Proposition cloturee", "Cette proposition n\u0027est plus active."); return; }
    renderProposal();
  }catch(e){
    renderError("Erreur de connexion", e.message);
  }
}

function renderError(title, msg){
  document.getElementById("root").innerHTML =
    '<div class="card" style="margin-top:40px;text-align:center">'+
    '<div style="font-size:48px;margin-bottom:10px">😕</div>'+
    '<h2 style="font-family:var(--f1);color:var(--red)">'+escapeHtml(title)+'</h2>'+
    '<p style="color:var(--text2);font-size:14px;line-height:1.6">'+escapeHtml(msg)+'</p>'+
    '</div>';
}

function renderConfirmed(){
  var pd=STATE.demande.proposed_data||{};
  document.getElementById("root").innerHTML =
    '<div class="success-page">'+
    '<div class="ico">✅</div>'+
    '<h2>RDV confirme et paye</h2>'+
    '<p>Votre rendez-vous du <strong>'+fmtDate(pd.date)+' a '+escapeHtml(pd.heure||"")+'</strong> est confirme chez <strong>'+escapeHtml(STATE.salon.nom||"")+'</strong>.</p>'+
    '<p style="margin-top:14px;font-size:13px;color:var(--text3)">Un email de confirmation vous a ete envoye. A bientot !</p>'+
    '</div>';
}

function renderRefused(){
  document.getElementById("root").innerHTML =
    '<div class="success-page">'+
    '<div class="ico">😔</div>'+
    '<h2 style="color:var(--text2)">Proposition refusee</h2>'+
    '<p>Vous avez refuse cette proposition. Vous pouvez contacter le salon pour discuter d\u0027autres options.</p>'+
    (STATE.salon.telephone ? '<p style="margin-top:10px"><strong>📞 '+escapeHtml(STATE.salon.telephone)+'</strong></p>' : '')+
    '</div>';
}

function renderProposal(){
  var pd=STATE.demande.proposed_data||{};
  var s=STATE.salon||{};
  var c=STATE.demande.client||{};
  var items=pd.items||[];
  var prixTotal=Number(pd.prix_total)||0;
  var acompte=Number(pd.acompte_montant)||0;
  var reste=prixTotal-acompte;

  var h='<div class="hdr">';
  if(s.logo) h+='<img class="logo" src="'+escapeHtml(s.logo)+'" alt="">';
  h+='<div class="salon">'+escapeHtml(s.nom||"Salon")+'</div>';
  h+='<div class="sub">vous propose un rendez-vous personnalise</div>';
  h+='</div>';

  h+='<div class="card"><h2>📅 Votre rendez-vous</h2>';
  h+='<div class="row"><span>Date</span><span class="v">'+fmtDate(pd.date)+'</span></div>';
  h+='<div class="row"><span>Heure</span><span class="v">'+escapeHtml(pd.heure||"")+'</span></div>';
  h+='<div class="row"><span>Duree estimee</span><span class="v">'+(pd.duree_minutes||0)+' min</span></div>';
  if(pd.collaborateur_nom) h+='<div class="row"><span>Avec</span><span class="v">'+escapeHtml(pd.collaborateur_nom)+'</span></div>';
  h+='</div>';

  h+='<div class="card"><h2>✨ Vos prestations</h2>';
  items.forEach(function(it){
    h+='<div class="item"><span>• '+escapeHtml(it.nom)+' <span style="color:var(--text3);font-size:11px">('+(it.duree||0)+' min)</span></span><span class="v">'+(Number(it.prix)||0).toFixed(2)+' €</span></div>';
  });
  h+='<div class="row tot"><span>Total</span><span class="v">'+prixTotal.toFixed(2)+' €</span></div>';
  if(pd.message_salon) h+='<div class="msg">"'+escapeHtml(pd.message_salon)+'"</div>';
  h+='</div>';

  if(acompte>0){
    h+='<div class="card"><h2>💳 Paiement de l\u0027acompte</h2>';
    h+='<div class="row"><span>Acompte a regler maintenant</span><span class="v" style="font-size:18px">'+acompte.toFixed(2)+' €</span></div>';
    h+='<div class="row"><span>Reste à payer le jour du rendez-vous</span><span class="v" style="color:var(--text2)">'+reste.toFixed(2)+' €</span></div>';
    h+='<div style="font-size:11px;color:var(--text3);margin-top:8px;text-align:center">🔒 Paiement securise par Stripe</div>';
    h+='</div>';
  }

  h+='<div id="errBox" class="err"></div>';

  if(acompte>0){
    // FIX 2026-05-12 : si Connect actif → Path A (Checkout Session avec transfer_data → $$ direct au salon)
    // Sinon : Path B (Stripe Elements + Charges API → $$ chez Luxyra, à éviter)
    var connectActive = s.stripe_connect_id && (s.stripe_connect_status==="active" || s.stripe_connect_status==="enabled" || s.stripe_connect_status==="payouts_pending");
    if(connectActive){
      h+='<button class="btn btn-gold" onclick="payViaCheckout()">💳 Payer '+acompte.toFixed(2)+' € et confirmer</button>';
      h+='<div style="font-size:11px;color:var(--text3);text-align:center;margin:-4px 0 10px">🔒 Paiement sécurisé par Stripe — encaissé directement par le salon</div>';
    } else {
      // 2026-10-09 : plus jamais d'encaissement sur le compte Luxyra. Sans compte Stripe du salon,
      // l'acompte se règle au salon.
      h+='<div style="font-size:12px;color:var(--text3);text-align:center;margin-bottom:8px">Acompte de '+acompte.toFixed(2)+' € à régler directement au salon.</div>';
      h+='<button class="btn btn-gold" onclick="confirmFree()">✅ Confirmer le rendez-vous</button>';
    }
  } else {
    h+='<button class="btn btn-gold" onclick="confirmFree()">✅ Confirmer le rendez-vous</button>';
  }
  h+='<button class="btn btn-danger" onclick="openRefuseModal()">❌ Refuser cette proposition</button>';
  h+='<div class="expires">'+fmtExpires(STATE.demande.expires_at)+'</div>';

  document.getElementById("root").innerHTML=h;
}

function openRefuseModal(){
  var h='<div class="modal" id="refuseModal" onclick="if(event.target===this)closeRefuseModal()">';
  h+='<div class="modal-box">';
  h+='<h2 style="font-family:var(--f1);color:var(--gold);margin:0 0 12px">Refuser la proposition ?</h2>';
  h+='<p style="font-size:13px;color:var(--text2);line-height:1.5;margin:0 0 14px">Vous pouvez expliquer brievement pourquoi (optionnel) :</p>';
  h+='<textarea id="refuseReason" rows="3" placeholder="Ex: la date ne me convient pas, je preferais le matin..."></textarea>';
  h+='<div style="display:flex;gap:10px;margin-top:16px">';
  h+='<button class="btn btn-outline" style="margin:0" onclick="closeRefuseModal()">Annuler</button>';
  h+='<button class="btn btn-danger" id="refuseBtn" style="margin:0" onclick="doRefuse()">Confirmer le refus</button>';
  h+='</div></div></div>';
  document.body.insertAdjacentHTML("beforeend",h);
}
function closeRefuseModal(){ var m=document.getElementById("refuseModal"); if(m) m.remove(); }
async function doRefuse(){
  var reason=document.getElementById("refuseReason").value.trim();
  var btn=document.getElementById("refuseBtn");
  btn.disabled=true; btn.textContent="Envoi...";
  try{
    var r=await fetch(SB_URL+"/functions/v1/rdv-demande-proposal-action",{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY},
      body:JSON.stringify({token:STATE.token,action:"refuse",reason:reason})
    });
    var data=await r.json();
    if(!r.ok){ alert("Erreur: "+(data.error||"refus impossible")); btn.disabled=false; btn.textContent="Confirmer le refus"; return; }
    closeRefuseModal();
    STATE.demande.status="refused";
    renderRefused();
  }catch(e){
    alert("Erreur de connexion: "+e.message);
    btn.disabled=false; btn.textContent="Confirmer le refus";
  }
}

// 2026-10-14 audit : un seul envoi à la fois (double tap = deux RDV avant le verrou serveur)
var _lxEnvoi=false;
function _lxBoutons(off){ try{ document.querySelectorAll("#root button.btn").forEach(function(b){ b.disabled=!!off; }); }catch(_){} }
async function confirmFree(){
  // Pas d'acompte → confirmation directe (sans paiement)
  if(_lxEnvoi) return;
  if(!confirm("Confirmer ce rendez-vous ?")) return;
  _lxEnvoi=true; _lxBoutons(true);
  try{
    var r=await fetch(SB_URL+"/functions/v1/rdv-demande-proposal-action",{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY},
      body:JSON.stringify({token:STATE.token,action:"confirm"})
    });
    var data=await r.json();
    if(!r.ok){ _lxEnvoi=false; _lxBoutons(false); document.getElementById("errBox").style.display="block"; document.getElementById("errBox").textContent=data.error||"Confirmation impossible"; return; }
    STATE.demande.status="confirmed";
    renderConfirmed();
  }catch(e){
    _lxEnvoi=false; _lxBoutons(false);
    document.getElementById("errBox").style.display="block"; document.getElementById("errBox").textContent="Erreur de connexion: "+e.message;
  }
}

// FIX 2026-05-12 : Path A — redirige vers Stripe Checkout pour Connect direct au salon
async function payViaCheckout(){
  if(_lxEnvoi) return;
  _lxEnvoi=true; _lxBoutons(true);
  var errEl=document.getElementById("errBox");
  errEl.style.display="none"; errEl.textContent="";
  try{
    var r=await fetch("/api/rdv-demande/connect-pay",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:STATE.token})
    });
    var data=await r.json();
    if(!r.ok || !data.url){
      _lxEnvoi=false; _lxBoutons(false);
      errEl.style.display="block";
      errEl.textContent=data.error||"Impossible de créer la session de paiement";
      return;
    }
    // Redirige vers Stripe Checkout — au retour, success_url ramène ici avec ?paid=success&session_id=xxx
    window.location.href=data.url;
  }catch(e){
    _lxEnvoi=false; _lxBoutons(false);
    errEl.style.display="block";
    errEl.textContent="Erreur de connexion: "+e.message;
  }
}

// FIX 2026-05-12 : finalise un retour de Stripe Checkout (Path A)
async function finalizeCheckoutReturn(token, sessionId){
  document.getElementById("root").innerHTML='<div class="spin"></div><div style="text-align:center;color:var(--text3);font-size:13px">Confirmation de votre paiement…</div>';
  try{
    var r=await fetch("/api/rdv-demande/finalize",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:token, session_id:sessionId})
    });
    var data=await r.json().catch(function(){ return {}; });
    // 2026-10-14 audit : 202 = paiement reçu, confirmation en cours (webhook Stripe) ; 5xx avec
    // paiement_recu = paiement reçu mais enregistrement à reprendre -> on attend la confirmation.
    if(r.status===202 || (r.status>=500 && data && data.paiement_recu)){
      window.history.replaceState({},"","/proposal.html?t="+encodeURIComponent(token));
      lxAttendreConfirmation(token, sessionId);
      return;
    }
    // 2026-10-30 (v2) : paiement en trop (autre option déjà retenue / proposition retirée) -> remboursé automatiquement
    if(r.ok && data && data.ok===false && (data.rembourse!==undefined)){ window.history.replaceState({},"","/proposal.html?t="+encodeURIComponent(token)); renderV2Rembourse(data.error); return; }
    if(!r.ok){
      renderError("Erreur lors de la confirmation", data.error||"Le paiement a réussi mais la confirmation a échoué. Contactez l\u0027établissement avec la référence : "+sessionId);
      return;
    }
    // Nettoie l'URL et affiche confirmation
    window.history.replaceState({},"","/proposal.html?t="+encodeURIComponent(token));
    // Recharge la proposition (qui est maintenant confirmed) puis affiche
    await fetchProposal();
  }catch(e){
    renderError("Erreur de connexion", e.message+" — votre paiement a peut-être réussi, vérifiez auprès de l\u0027établissement.");
  }
}

// 2026-10-14 audit : paiement reçu, confirmation en attente -> relit le statut toutes les 5 s
// pendant 3 min (aucun bouton de paiement affiché), puis message rassurant.
var _lxAttente=null;
function renderPaiementEnCours(){
  document.getElementById("root").innerHTML =
    '<div class="success-page">'+
    '<div class="spin"></div>'+
    '<h2 style="color:var(--gold)">Paiement reçu, confirmation en cours…</h2>'+
    '<p>Votre acompte a bien été reçu. Nous finalisons la confirmation de votre rendez-vous, merci de patienter quelques instants.</p>'+
    '</div>';
}
function renderAttenteExpiree(){
  var tel=(STATE.salon&&STATE.salon.telephone)||"";
  document.getElementById("root").innerHTML =
    '<div class="success-page">'+
    '<div class="ico">🕒</div>'+
    '<h2 style="color:var(--gold)">Paiement reçu</h2>'+
    '<p>Votre paiement a bien été reçu. La confirmation de votre rendez-vous prend un peu plus de temps que prévu : elle vous parviendra par e-mail ou SMS.</p>'+
    '<p style="margin-top:10px">Inutile de payer à nouveau. En cas de doute, contactez l\u0027établissement.</p>'+
    (tel ? '<p style="margin-top:10px"><strong>📞 '+escapeHtml(tel)+'</strong></p>' : '')+
    '</div>';
}
function lxAttendreConfirmation(token, sessionId){
  if(_lxAttente) return;
  STATE.token=token;
  var debut=Date.now(), DUREE=3*60*1000, PAS=5000, relanceFaite=false;
  _lxAttente=true;
  renderPaiementEnCours();
  async function tour(){
    var st=null;
    try{
      var r=await fetch(SB_URL+"/functions/v1/rdv-demande-proposal-action",{
        method:"POST",
        headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY},
        body:JSON.stringify({token:token,action:"get"})
      });
      var d=await r.json().catch(function(){ return {}; });
      if(r.ok && d && d.demande){
        STATE.demande=d.demande; STATE.salon=d.salon||STATE.salon||{};
        if(d.version===2) STATE.v2=d; // 2026-10-30
        st=d.demande.status;
      }
    }catch(_){}
    if(st==="confirmed"){ _lxAttente=null; if(STATE.v2) renderV2Confirme(); else renderConfirmed(); return; }
    if(Date.now()-debut>=DUREE){
      // Dernière tentative de finalisation (le verrou d'une confirmation interrompue a expiré)
      if(!relanceFaite && sessionId){
        relanceFaite=true;
        try{
          var f=await fetch("/api/rdv-demande/finalize",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({token:token, session_id:sessionId}) });
          var fd=await f.json().catch(function(){ return {}; });
          if(f.status===200 && fd && fd.ok){ _lxAttente=null; await fetchProposal(); return; }
        }catch(_){}
      }
      _lxAttente=null; renderAttenteExpiree(); return;
    }
    setTimeout(tour, PAS);
  }

async function doPayment(){
  var btn=document.getElementById("payBtn");
  var errEl=document.getElementById("payErr");
  var pd=STATE.demande.proposed_data||{};
  var acompte=Number(pd.acompte_montant)||0;
  var name=document.getElementById("payName").value.trim()||"Client";
  // FIX 2026-05-12 : GARDE-FOU ANTI-LUXYRA
  // Si le salon a Connect configuré, on REFUSE de charger via Charges API (Path B → $$ Luxyra)
  // Le bon flow est payViaCheckout (Path A → $$ direct salon). Si on arrive ici, c'est un bug.
  var s=STATE.salon||{};
  if(s.stripe_connect_id){
    errEl.textContent="Erreur de routage — paiement bloqué pour sécurité. Contactez le salon.";
    console.error("doPayment Path B bloqué : salon a stripe_connect_id, utiliser payViaCheckout()");
    return;
  }
  btn.disabled=true; btn.textContent="Paiement en cours...";
  try{
    var result=await stripe.createToken(window._proposalCard,{name:name});
    if(result.error){ errEl.textContent=result.error.message; btn.disabled=false; btn.textContent="🔒 Payer "+acompte.toFixed(2)+" €"; return; }
    var token=result.token;
    var brand=token.card.brand, last4=token.card.last4;

    // Path A : Stripe Connect actif
    var s=STATE.salon||{};
    var connectActive = s.stripe_connect_id && s.stripe_connect_status==="active";

    if(connectActive){
      // Pour la V1 on fait simple : on appelle l'edge function rdv-charge-acompte
      // qui charge sur le compte Luxyra (path B). Le path A Connect Checkout demande
      // une redirection : a faire en V1.5.
      // (Note : pour rester safe, on reste sur path B pour cette V1 meme si Connect est actif.
      //  Le salon recevra l\u0027acompte plus tard via reversement manuel.)
    }

    // Charger l\u0027acompte via edge function rdv-charge-acompte (Path B = compte Luxyra)
    // mais sans creer de rdv_online — on n'a besoin que du paiement reussi.
    // Utiliser l'API Charges directement via une nouvelle action de l'edge function
    // proposal-action qui combine paiement + creation rdv. Mais la couche actuelle est :
    // 1) Charge Stripe (cote front via stripe.createToken => token)
    // 2) Confirm via rdv-demande-proposal-action (action=confirm) avec stripe_token + brand + last4
    //    L'edge function va creer le rdv_online avec acompte_paye=true (notre trigger v3
    //    accepte stripe_token comme preuve).
    // Le debit reel sera fait via une edge function future ou manuellement par le salon Stripe dashboard.
    // Pour la V1 : on enregistre juste le token (preuve carte valide).
    // V1.5 : appel rdv-charge-acompte separe pour debit reel.
    var r=await fetch(SB_URL+"/functions/v1/rdv-demande-proposal-action",{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY},
      body:JSON.stringify({
        token:STATE.token,
        action:"confirm",
        stripe_token:token.id,
        stripe_brand:brand,
        stripe_last4:last4
      })
    });
    var data=await r.json();
    if(!r.ok){ errEl.textContent=data.error||"Erreur lors de la confirmation"; btn.disabled=false; btn.textContent="🔒 Payer "+acompte.toFixed(2)+" €"; return; }
    closePaymentModal();
    STATE.demande.status="confirmed";
    renderConfirmed();
  }catch(e){
    errEl.textContent="Erreur: "+e.message;
    btn.disabled=false; btn.textContent="🔒 Payer "+acompte.toFixed(2)+" €";
  }
}

  h+='</div>';
  if(d.paiement_en_cours&&!o) h+='<div class="s" style="color:#fbbf24">Un paiement est en cours sur cette proposition.</div>';
  if(o){ var ac2=Number(o.acompte_montant)||0, paye2=ac2>0&&STATE.salon&&STATE.salon.stripe_actif;
    h+='<button class="btn btn-gold" id="v2go" onclick="v2Valider()">'+(paye2?'Payer '+v2Eur(ac2)+' et confirmer':'Confirmer ce rendez-vous')+'</button>'; }
  else h+='<button class="btn btn-gold" disabled>Choisissez une option</button>';
  h+='<div class="v2m" style="width:100%;text-align:center"><a style="color:#f8a3a3;font-weight:800" onclick="openRefuseModal()">Refuser les propositions</a><div style="font-size:12px;color:var(--text3)">Valable jusqu\'au '+escapeHtml(v2Echeance(d.expires_at))+'</div></div>';
  return h+'</div>';
}
function v2Choisir(id){ V2.sel=id; try{ sessionStorage.setItem("lxv2sel_"+STATE.token,id); }catch(_){} renderV2(); }
function v2Detail(id){ V2.detail[id]=!V2.detail[id]; renderV2(); }
function v2Erreur(msg){ var e=document.getElementById("errBox"); if(e){ e.style.display="block"; e.textContent=msg; e.scrollIntoView({block:"center"}); } }
async function v2Valider(){
  if(V2.envoi) return; var o=v2Opt(V2.sel); if(!o) return;
  var ac=Number(o.acompte_montant)||0, paye=ac>0&&STATE.salon&&STATE.salon.stripe_actif;
  if(!paye && !confirm("Confirmer l'option "+v2Lettre(o.rang)+" : "+v2Jour(o.date)+" à "+o.heure+" ?")) return;
  V2.envoi=true; var b=document.getElementById("v2go"); if(b){ b.disabled=true; b.textContent=paye?"Redirection vers le paiement…":"Confirmation…"; }
  try{
    if(paye){
      var r=await fetch("/api/rdv-demande/connect-pay",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:STATE.token,option_id:o.id})});
      var j=await r.json().catch(function(){return {};});
      if(!r.ok||!j.url){ V2.envoi=false; await v2Recharger(); v2Erreur(j.error||"Impossible de créer le paiement"); return; }
      window.location.href=j.url; return;
    }
    var r2=await fetch(SB_URL+"/functions/v1/rdv-demande-proposal-action",{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY},body:JSON.stringify({token:STATE.token,action:"choose",option_id:o.id})});
    var j2=await r2.json().catch(function(){return {};});
    V2.envoi=false;
    if(!r2.ok){ await v2Recharger(); v2Erreur(j2.error||"Confirmation impossible"); return; }
    await v2Recharger();
  }catch(e){ V2.envoi=false; if(b){ b.disabled=false; } v2Erreur("Erreur de connexion : "+e.message); }
}
async function v2Recharger(){
  try{
    var r=await fetch(SB_URL+"/functions/v1/rdv-demande-proposal-action",{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY},body:JSON.stringify({token:STATE.token,action:"get"})});
    var d=await r.json(); if(r.ok&&d.version===2){ STATE.v2=d; STATE.salon=d.salon||{}; STATE.demande=d.demande; renderV2(); }
  }catch(_){}
}
function renderV2Confirme(){
  var d=STATE.v2.demande, s=STATE.salon||{}, o=v2Opt(d.option_choisie_id)||{}, ac=Number(o.acompte_montant)||0, paye=Number(d.acompte_paye)||0;
  var lib=v2Options().filter(function(x){ return x.id!==o.id && x.statut==="liberee"; }).map(function(x){ return v2Lettre(x.rang); });
  var h='<div class="v2c" style="text-align:center"><div class="v2top" style="text-align:left"><a class="lg" href="https://luxyra.fr/">Luxyra</a><a class="me" href="https://luxyra.fr/compte">Mon espace</a></div><div class="ok">✓</div>';
  h+='<div class="v2h1">Rendez-vous confirmé</div><div class="v2lead">'+(d.client&&d.client.email?'Un e-mail de confirmation vous a été envoyé.':'Votre rendez-vous est enregistré.')+'</div>';
  h+='<div class="rec">';
  var lg=function(k,v,c){ return '<div class="v2r"><span>'+k+'</span><b'+(c?' style="color:var(--gold)"':'')+'>'+v+'</b></div>'; };
  h+=lg("Quand",escapeHtml(v2Jour(o.date,true))+" "+escapeHtml(o.heure||""))+lg("Durée",v2Duree(o.duree_minutes));
  if(o.collaborateur_nom) h+=lg("Avec",escapeHtml(o.collaborateur_nom));
  h+=lg("Prestation",escapeHtml(o.libelle||""))+lg("Total",v2Eur(o.prix_total));
  if(ac>0){ h+=paye>0?lg("Acompte payé",v2Eur(paye),true)+lg("Reste au salon",v2Eur((Number(o.prix_total)||0)-paye)):lg("Acompte (à régler au salon)",v2Eur(ac)); }
  h+='</div>';
  h+='<div style="max-width:460px;margin:0 auto 16px;text-align:left;color:var(--text3);font-size:14px">'+(d.recu_acompte?'Reçu d\'acompte n° '+escapeHtml(String(d.recu_acompte))+' ('+escapeHtml(s.nom||"")+')<br>':'')+(lib.length?'L\'option '+lib.join(", ")+(lib.length>1?' ont':' a')+' été libérée'+(lib.length>1?'s':'')+'.':'')+'</div>';
  var adr=[s.adresse,s.cp,s.ville].filter(Boolean).join(" ");
  h+='<div class="v2btns"><button class="btn btn-outline" onclick="v2Calendrier()">Calendrier</button>'+(adr?'<a class="btn btn-outline" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(adr)+'">Itinéraire</a>':'<span></span>')+'</div>';
  h+='<div style="max-width:460px;margin:12px auto 0"><a class="btn btn-gold" href="https://luxyra.fr/compte">Mon espace Luxyra</a></div></div>';
  var root=document.getElementById("root"); root.className="wrap v2"; root.innerHTML=h;
}
function v2Calendrier(){
  var d=STATE.v2.demande, s=STATE.salon||{}, o=v2Opt(d.option_choisie_id); if(!o) return;
  var dt=String(o.date).replace(/-/g,""), hm=String(o.heure).replace(":","")+"00";
  var fin=new Date(o.date+"T"+o.heure+":00"); fin.setMinutes(fin.getMinutes()+(Number(o.duree_minutes)||30));
  var p=function(n){return String(n).padStart(2,"0");}, dtf=fin.getFullYear()+p(fin.getMonth()+1)+p(fin.getDate())+"T"+p(fin.getHours())+p(fin.getMinutes())+"00";
  var ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Luxyra//RDV//FR","BEGIN:VEVENT","UID:"+d.id+"@luxyra.fr","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z","DTSTART;TZID=Europe/Paris:"+dt+"T"+hm,"DTEND;TZID=Europe/Paris:"+dtf,"SUMMARY:"+(o.libelle||"Rendez-vous")+" - "+(s.nom||""),"LOCATION:"+[s.adresse,s.cp,s.ville].filter(Boolean).join(" "),"END:VEVENT","END:VCALENDAR"].join("\r\n");
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})); a.download="rendez-vous.ics"; document.body.appendChild(a); a.click(); a.remove();
}
function renderV2Rembourse(msg){
  var s=STATE.salon||{};
  document.getElementById("root").innerHTML='<div class="success-page"><div class="ico">↩️</div><h2 style="color:var(--gold)">Paiement non utilisé</h2><p>'+escapeHtml(msg||"Ce paiement n'a pas pu être utilisé : il vous est remboursé automatiquement.")+'</p>'+(s.telephone?'<p style="margin-top:10px"><strong>📞 '+escapeHtml(s.telephone)+'</strong></p>':'')+'</div>';
}

// Init — FIX 2026-05-12 : intercepte retour Stripe Checkout (Path A) avant fetch normal
(function(){
  var p=new URLSearchParams(window.location.search);
  var paid=p.get("paid");
  var token=p.get("t");
  var sessionId=p.get("session_id");
  if(paid==="success" && token && sessionId){
    // Retour de Stripe Checkout : finalise via worker
    finalizeCheckoutReturn(token, sessionId);
    return;
  }
  if(paid==="cancel" && token){
    // Annulation : nettoie l'URL et affiche la proposition normalement
    window.history.replaceState({},"","/proposal.html?t="+encodeURIComponent(token));
  }
  fetchProposal();
})();
</script>
</body>
